<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관용표현 탐험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* 레이아웃: 원고지 격자 위에 놓인 한 장의 활동지 카드, 화면 하나씩 전환 */
  :root {
    --paper: #f3f8f4;
    --grid: #d5e8dc;
    --sheet: #ffffff;
    --ink: #1d2b25;
    --muted: #5b6e65;
    --line: #c7dccf;
    --accent: #2563c9;
    --accent-soft: #e4edfb;
    --marker: #ffe066;
    --good: #18864b;
    --good-soft: #e3f4ea;
    --bad: #c93a32;
    --bad-soft: #fbe8e6;
    --shadow: 0 1px 0 #c7dccf, 0 12px 30px -18px rgba(29, 60, 45, .35);
    --font-display: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #101815; --grid: #1b2822; --sheet: #17221d; --ink: #e5efe9; --muted: #9db2a7;
      --line: #2b3d34; --accent: #7fa9ff; --accent-soft: #1d2b46; --marker: #c9a920;
      --good: #5fd18f; --good-soft: #163325; --bad: #ff8a80; --bad-soft: #3a1d1b;
      --shadow: 0 1px 0 #2b3d34, 0 12px 30px -18px rgba(0, 0, 0, .7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #101815; --grid: #1b2822; --sheet: #17221d; --ink: #e5efe9; --muted: #9db2a7;
    --line: #2b3d34; --accent: #7fa9ff; --accent-soft: #1d2b46; --marker: #c9a920;
    --good: #5fd18f; --good-soft: #163325; --bad: #ff8a80; --bad-soft: #3a1d1b;
    --shadow: 0 1px 0 #2b3d34, 0 12px 30px -18px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.6;
    min-height: 100vh;
    padding-block: 32px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .sheet {
    max-width: 640px;
    margin: 0 auto;
    background: var(--sheet);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: clamp(22px, 5vw, 40px);
  }
  h1, h2, .display { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; }
  .eyebrow {
    font-size: 13px; letter-spacing: .08em; color: var(--muted); margin: 0;
  }
  .mark {
    background: linear-gradient(transparent 55%, var(--marker) 55%, var(--marker) 92%, transparent 92%);
    padding: 0 2px;
  }
  .screen { display: flex; flex-direction: column; gap: 24px; }
  .screen.enter { animation: fadeUp .35s ease both; }
  @keyframes fadeUp { from { opacity: .3; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* 버튼 */
  .btn {
    font-family: var(--font-display);
    font-size: 19px;
    min-height: 52px;
    padding: 0 26px;
    border-radius: 12px;
    border: 2px solid var(--ink);
    background: var(--sheet);
    color: var(--ink);
    cursor: pointer;
    transition: transform .12s ease, background .12s ease;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn:focus-visible, .choice:focus-visible, .dot:focus-visible { outline: 3px solid var(--marker); outline-offset: 2px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row.spread { justify-content: space-between; }
  .row .btn { flex: 1 1 140px; }

  /* 메인 */
  .home-title { font-size: clamp(38px, 9vw, 56px); line-height: 1.15; }
  .home-lead { margin: 0; color: var(--muted); max-width: 32em; }
  .samples { display: flex; flex-wrap: wrap; gap: 8px; }
  .sample {
    font-family: var(--font-display);
    border: 1.5px dashed var(--line);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: 15px;
    color: var(--muted);
  }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 12px; }
  .fact { padding: 14px 8px; text-align: center; }
  .fact + .fact { border-left: 1px solid var(--line); }
  .fact b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--accent); }
  .fact span { font-size: 14px; color: var(--muted); }

  /* 문제 */
  .progress { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .counter { font-family: var(--font-display); font-size: 18px; font-variant-numeric: tabular-nums; }
  .counter small { color: var(--muted); font-size: 15px; }
  .dots { display: flex; gap: 8px; }
  .dot {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--line); background: var(--sheet); color: var(--muted);
    font-family: var(--font-display); font-size: 15px; cursor: pointer;
  }
  .dot.answered { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .dot.current { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
  .bar { height: 8px; background: var(--grid); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
  .tag {
    align-self: flex-start;
    font-size: 14px; padding: 3px 12px; border-radius: 6px;
    background: var(--marker); color: #1d2b25;
  }
  .q-text { font-size: clamp(22px, 5vw, 26px); line-height: 1.45; }
  .q-situation {
    margin: 0; padding: 14px 18px;
    border-left: 4px solid var(--line);
    background: var(--paper); border-radius: 0 10px 10px 0;
  }
  .blank {
    display: inline-block; min-width: 6em; border-bottom: 2px solid var(--ink);
    text-align: center; color: var(--muted);
  }
  .choices { display: grid; gap: 10px; }
  .choice {
    display: flex; align-items: center; gap: 14px;
    width: 100%; text-align: left;
    padding: 14px 16px; min-height: 58px;
    border: 2px solid var(--line); border-radius: 12px;
    background: var(--sheet); color: var(--ink);
    font: inherit; cursor: pointer;
    transition: border-color .12s ease, background .12s ease;
  }
  .choice:hover { border-color: var(--accent); }
  .choice .num {
    flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center;
    border: 2px solid var(--line); font-family: var(--font-display); font-size: 16px; color: var(--muted);
  }
  .choice[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .choice[aria-checked="true"] .num { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
  .hint { margin: 0; font-size: 14px; color: var(--muted); }

  /* 결과 */
  .score-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .stamp {
    flex: 0 0 auto;
    width: 150px; height: 150px; border-radius: 50%;
    border: 5px double var(--bad);
    color: var(--bad);
    display: grid; place-items: center; text-align: center;
    transform: rotate(-8deg);
    font-family: var(--font-display);
  }
  .stamp b { display: block; font-weight: 400; font-size: 52px; line-height: 1; font-variant-numeric: tabular-nums; }
  .stamp span { font-size: 16px; }
  .stamp.pop { animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes stamp { from { transform: rotate(-8deg) scale(1.6); opacity: .2; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
  .score-copy { flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .score-copy h2 { font-size: 28px; }
  .score-copy p { margin: 0; color: var(--muted); }
  .tally { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .tally div {
    border-radius: 10px; padding: 10px 4px; text-align: center;
    font-family: var(--font-display); font-size: 15px;
  }
  .tally .ok { background: var(--good-soft); color: var(--good); }
  .tally .no { background: var(--bad-soft); color: var(--bad); }
  .tally b { display: block; font-weight: 400; font-size: 22px; }

  /* 오답 노트 */
  .review-list { display: flex; flex-direction: column; gap: 16px; }
  .review-card { border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .review-card h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; line-height: 1.45; }
  .review-card .q-situation { font-size: 15px; }
  .ans { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: 8px; }
  .ans .lbl { flex: 0 0 auto; font-size: 13px; font-family: var(--font-display); }
  .ans.mine { background: var(--bad-soft); color: var(--bad); }
  .ans.right { background: var(--good-soft); color: var(--good); }
  .explain { margin: 0; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 15px; color: var(--ink); }
  .explain b { font-family: var(--font-display); font-weight: 400; color: var(--accent); }
  .perfect { text-align: center; padding: 24px; border: 2px dashed var(--good); border-radius: 14px; color: var(--good); font-family: var(--font-display); font-size: 20px; }

  /* 확인 창 */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(16, 24, 21, .5);
    display: grid; place-items: center;
    padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  }
  .dialog {
    width: 100%; max-width: 400px;
    background: var(--sheet); border-radius: 16px; border: 1px solid var(--line);
    padding: 24px; display: flex; flex-direction: column; gap: 16px;
    animation: fadeUp .2s ease both;
  }
  .dialog h2 { font-size: 22px; }
  .dialog p { margin: 0; color: var(--muted); }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; width: 100%; height: 100%; }

  @media (max-width: 440px) {
    .stamp { width: 120px; height: 120px; }
    .stamp b { font-size: 42px; }
    .dot { width: 30px; height: 30px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<main class="sheet" aria-live="polite">
  <!-- 메인 화면 -->
  <section id="home" class="screen">
    <p class="eyebrow">6학년 국어 · 관용표현 익히기</p>
    <h1 class="home-title">관용표현<br><span class="mark">탐험대</span></h1>
    <p class="home-lead">'발이 넓다'는 정말 발이 크다는 뜻일까요? 우리 몸이 들어간 재미있는 표현들의 진짜 뜻을 찾아 5문제를 풀어 보세요.</p>
    <div class="samples" aria-hidden="true">
      <span class="sample">발이 넓다</span><span class="sample">입이 가볍다</span><span class="sample">손이 크다</span><span class="sample">귀가 얇다</span><span class="sample">눈코 뜰 새 없다</span>
    </div>
    <div class="facts">
      <div class="fact"><b>5</b><span>문제</span></div>
      <div class="fact"><b>4지</b><span>선다형</span></div>
      <div class="fact"><b>100</b><span>점 만점</span></div>
    </div>
    <button class="btn primary" id="startBtn" type="button">시작하기</button>
  </section>

  <!-- 문제 풀이 화면 -->
  <section id="quiz" class="screen" hidden>
    <div class="progress">
      <div class="counter" id="counter"></div>
      <div class="dots" id="dots" role="tablist" aria-label="문제 번호로 이동"></div>
    </div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
    <span class="tag" id="qType"></span>
    <div id="qBody" style="display:flex;flex-direction:column;gap:14px"></div>
    <div class="choices" id="choices" role="radiogroup" aria-label="보기"></div>
    <p class="hint">보기를 다시 누르면 답을 바꿀 수 있어요. 키보드 숫자 1~4로도 고를 수 있어요.</p>
    <div class="row spread">
      <button class="btn" id="prevBtn" type="button">← 이전</button>
      <button class="btn primary" id="nextBtn" type="button">다음 →</button>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section id="result" class="screen" hidden>
    <p class="eyebrow">채점 결과</p>
    <div class="score-wrap">
      <div class="stamp" id="stamp"><div><b id="scoreNum">0</b><span>/ 100점</span></div></div>
      <div class="score-copy">
        <h2 id="scoreTitle"></h2>
        <p id="scoreSub"></p>
      </div>
    </div>
    <div class="tally" id="tally"></div>
    <div class="row">
      <button class="btn primary" id="reviewBtn" type="button">틀린 문제 확인하기</button>
      <button class="btn" id="retryBtn" type="button">다시 풀기</button>
    </div>
  </section>

  <!-- 오답 노트 -->
  <section id="review" class="screen" hidden>
    <p class="eyebrow">오답 노트</p>
    <h2 style="font-size:30px">틀린 문제를 <span class="mark">다시 살펴봐요</span></h2>
    <div class="review-list" id="reviewList"></div>
    <div class="row">
      <button class="btn" id="backBtn" type="button">결과로 돌아가기</button>
      <button class="btn primary" id="retryBtn2" type="button">다시 풀기</button>
    </div>
  </section>
</main>

<!-- 제출 확인 창 -->
<div class="overlay" id="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText"></p>
    <div class="row">
      <button class="btn" id="dlgCancel" type="button"></button>
      <button class="btn primary" id="dlgOk" type="button">제출하기</button>
    </div>
  </div>
</div>

<canvas id="confetti" hidden></canvas>

<script>
  const questions = [
    {
      type: "뜻 고르기",
      question: "\"발이 넓다\"의 뜻으로 알맞은 것은?",
      choices: ["발의 크기가 크다", "아는 사람이 많다", "걸음이 빠르다", "여행을 많이 다닌다"],
      answer: 1,
      idiom: "발이 넓다",
      explanation: "사귀어 아는 사람이 많아 활동하는 범위가 넓다는 뜻이에요. 예) 우리 삼촌은 발이 넓어서 어딜 가나 아는 사람을 만나."
    },
    {
      type: "상황 고르기",
      question: "다음 상황의 민수에게 어울리는 표현은?",
      situation: "민수는 친구가 비밀이라고 한 이야기를 다른 친구들에게 금방 말해 버렸어요.",
      choices: ["입이 무겁다", "입이 짧다", "입이 가볍다", "입을 모으다"],
      answer: 2,
      idiom: "입이 가볍다",
      explanation: "말이 많고 비밀을 잘 지키지 못한다는 뜻이에요. 반대말은 '입이 무겁다'예요. '입이 짧다'는 음식을 가려 먹는다는 뜻이에요."
    },
    {
      type: "뜻 고르기",
      question: "\"손이 크다\"의 뜻으로 알맞은 것은?",
      choices: ["손재주가 좋다", "씀씀이가 넉넉하고 크다", "일을 빨리 한다", "힘이 아주 세다"],
      answer: 1,
      idiom: "손이 크다",
      explanation: "무엇을 주거나 쓸 때 넉넉하게 한다는 뜻이에요. 예) 할머니는 손이 커서 떡을 늘 한가득 만드셔."
    },
    {
      type: "상황 고르기",
      question: "다음 상황의 지수에게 어울리는 표현은?",
      situation: "지수는 광고에서 \"이걸 먹으면 키가 쑥쑥 큰대!\"라는 말을 듣자마자 바로 사 달라고 졸랐어요.",
      choices: ["귀가 밝다", "귀를 기울이다", "귀에 못이 박히다", "귀가 얇다"],
      answer: 3,
      idiom: "귀가 얇다",
      explanation: "남의 말을 쉽게 믿는다는 뜻이에요. '귀에 못이 박히다'는 같은 말을 여러 번 들었다는 뜻이고, '귀가 밝다'는 소리를 잘 듣는다는 뜻이에요."
    },
    {
      type: "빈칸 채우기",
      question: "빈칸에 들어갈 알맞은 표현은?",
      sentence: ["학예회 준비 때문에 요즘 우리 반은 ", " 바쁘다."],
      choices: ["눈코 뜰 새 없이", "눈이 높게", "코가 납작하게", "발을 끊고"],
      answer: 0,
      idiom: "눈코 뜰 새 없다",
      explanation: "정신을 차릴 수 없을 만큼 매우 바쁘다는 뜻이에요. '코가 납작해지다'는 기가 죽는다는 뜻이고, '발을 끊다'는 오가던 곳에 더 이상 가지 않는다는 뜻이에요."
    }
  ];
  const POINT = 100 / questions.length;
  const NUMS = ["①", "②", "③", "④"];

  let answers = [];
  let current = 0;

  const $ = (id) => document.getElementById(id);
  const screens = ["home", "quiz", "result", "review"];

  function show(id) {
    screens.forEach((s) => { $(s).hidden = s !== id; $(s).classList.remove("enter"); });
    void $(id).offsetWidth;
    $(id).classList.add("enter");
    window.scrollTo({ top: 0 });
  }

  function esc(t) {
    return t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function questionHtml(q, filled) {
    let html = `<h2 class="q-text">${esc(q.question)}</h2>`;
    if (q.situation) html += `<p class="q-situation">${esc(q.situation)}</p>`;
    if (q.sentence) {
      const mid = filled ? `<span class="mark">${esc(filled)}</span>` : `<span class="blank">(&nbsp;&nbsp;?&nbsp;&nbsp;)</span>`;
      html += `<p class="q-situation">${esc(q.sentence[0])}${mid}${esc(q.sentence[1])}</p>`;
    }
    return html;
  }

  function startQuiz() {
    answers = questions.map(() => null);
    current = 0;
    renderQuestion();
    show("quiz");
  }

  function renderQuestion() {
    const q = questions[current];
    const done = answers.filter((a) => a !== null).length;
    $("counter").innerHTML = `${current + 1}번 문제 <small>/ ${questions.length} · ${done}개 풀었어요</small>`;
    $("barFill").style.width = `${(done / questions.length) * 100}%`;
    $("qType").textContent = q.type;
    $("qBody").innerHTML = questionHtml(q);

    $("dots").innerHTML = questions.map((_, i) => {
      const cls = ["dot", answers[i] !== null ? "answered" : "", i === current ? "current" : ""].join(" ");
      return `<button class="${cls}" type="button" data-go="${i}" aria-label="${i + 1}번 문제${answers[i] !== null ? ", 풀었음" : ""}" ${i === current ? 'aria-current="step"' : ""}>${i + 1}</button>`;
    }).join("");

    $("choices").innerHTML = q.choices.map((c, i) =>
      `<button class="choice" type="button" role="radio" aria-checked="${answers[current] === i}" data-pick="${i}">
         <span class="num">${i + 1}</span><span>${esc(c)}</span>
       </button>`).join("");

    $("prevBtn").disabled = current === 0;
    const last = current === questions.length - 1;
    $("nextBtn").textContent = last ? "최종 제출" : "다음 →";
  }

  function pick(i) {
    answers[current] = i;
    renderQuestion();
  }

  function openSubmitDialog() {
    const missing = answers.map((a, i) => (a === null ? i + 1 : null)).filter(Boolean);
    if (missing.length) {
      $("dlgTitle").textContent = "아직 풀지 않은 문제가 있어요";
      $("dlgText").textContent = `${missing.join("번, ")}번 문제를 풀지 않았어요. 풀지 않은 문제는 틀린 것으로 채점돼요.`;
      $("dlgCancel").textContent = "돌아가서 풀기";
      $("dlgOk").textContent = "그래도 제출";
      $("dlgCancel").dataset.go = missing[0] - 1;
    } else {
      $("dlgTitle").textContent = "최종 제출할까요?";
      $("dlgText").textContent = "제출하면 답을 바꿀 수 없어요.";
      $("dlgCancel").textContent = "취소";
      $("dlgOk").textContent = "제출하기";
      delete $("dlgCancel").dataset.go;
    }
    $("overlay").hidden = false;
    $("dlgOk").focus();
  }

  function closeDialog() { $("overlay").hidden = true; }

  function submit() {
    closeDialog();
    const correct = answers.filter((a, i) => a === questions[i].answer).length;
    const score = Math.round(correct * POINT);
    $("scoreNum").textContent = score;

    let title, sub;
    if (score === 100) { title = "완벽해요! 관용표현 박사님!"; sub = "5문제를 모두 맞혔어요. 친구에게도 오늘 배운 표현을 알려 주세요."; }
    else if (score >= 60) { title = "잘했어요!"; sub = `5문제 중 ${correct}문제를 맞혔어요. 틀린 문제만 다시 살펴볼까요?`; }
    else { title = "괜찮아요, 다시 해 봐요!"; sub = `5문제 중 ${correct}문제를 맞혔어요. 오답 노트로 함께 공부해 봐요.`; }
    $("scoreTitle").textContent = title;
    $("scoreSub").textContent = sub;

    $("tally").innerHTML = questions.map((q, i) => {
      const ok = answers[i] === q.answer;
      return `<div class="${ok ? "ok" : "no"}"><b>${ok ? "○" : "✕"}</b>${i + 1}번</div>`;
    }).join("");

    $("reviewBtn").hidden = correct === questions.length;
    renderReview();
    show("result");
    const stamp = $("stamp");
    stamp.classList.remove("pop"); void stamp.offsetWidth; stamp.classList.add("pop");
    if (score === 100) confetti();
  }

  function renderReview() {
    const wrong = questions.map((q, i) => ({ q, i })).filter(({ q, i }) => answers[i] !== q.answer);
    if (!wrong.length) {
      $("reviewList").innerHTML = `<div class="perfect">틀린 문제가 없어요! 🎉</div>`;
      return;
    }
    $("reviewList").innerHTML = wrong.map(({ q, i }) => {
      const mine = answers[i] === null ? "선택하지 않음" : `${NUMS[answers[i]]} ${q.choices[answers[i]]}`;
      return `<article class="review-card">
        <p class="eyebrow">${i + 1}번 · ${esc(q.type)}</p>
        ${questionHtml(q, q.sentence ? q.choices[q.answer] : null).replace('<h2 class="q-text">', "<h3>").replace("</h2>", "</h3>")}
        <div class="ans mine"><span class="lbl">내가 고른 답</span><span>${esc(mine)}</span></div>
        <div class="ans right"><span class="lbl">정답</span><span>${NUMS[q.answer]} ${esc(q.choices[q.answer])}</span></div>
        <p class="explain"><b>${esc(q.idiom)}</b> ${esc(q.explanation)}</p>
      </article>`;
    }).join("");
  }

  function confetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = $("confetti");
    cv.hidden = false;
    const ctx = cv.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.scale(dpr, dpr);
    const colors = ["#2563c9", "#ffe066", "#18864b", "#c93a32", "#7fa9ff"];
    const bits = Array.from({ length: 120 }, () => ({
      x: innerWidth / 2, y: innerHeight / 3,
      vx: (Math.random() - .5) * 12, vy: Math.random() * -12 - 3,
      r: Math.random() * Math.PI, s: 6 + Math.random() * 6,
      c: colors[Math.floor(Math.random() * colors.length)]
    }));
    let t = 0;
    (function frame() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      bits.forEach((b) => {
        b.vy += .35; b.x += b.vx; b.y += b.vy; b.r += .15;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
        ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
        ctx.restore();
      });
      if (++t < 140) requestAnimationFrame(frame);
      else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
    })();
  }

  // 이벤트
  $("startBtn").addEventListener("click", startQuiz);
  $("choices").addEventListener("click", (e) => {
    const b = e.target.closest("[data-pick]");
    if (b) pick(Number(b.dataset.pick));
  });
  $("dots").addEventListener("click", (e) => {
    const b = e.target.closest("[data-go]");
    if (b) { current = Number(b.dataset.go); renderQuestion(); }
  });
  $("prevBtn").addEventListener("click", () => { if (current > 0) { current--; renderQuestion(); } });
  $("nextBtn").addEventListener("click", () => {
    if (current < questions.length - 1) { current++; renderQuestion(); }
    else openSubmitDialog();
  });
  $("dlgCancel").addEventListener("click", () => {
    const go = $("dlgCancel").dataset.go;
    closeDialog();
    if (go !== undefined) { current = Number(go); renderQuestion(); }
  });
  $("dlgOk").addEventListener("click", submit);
  $("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) closeDialog(); });
  $("reviewBtn").addEventListener("click", () => show("review"));
  $("backBtn").addEventListener("click", () => show("result"));
  $("retryBtn").addEventListener("click", () => show("home"));
  $("retryBtn2").addEventListener("click", () => show("home"));

  document.addEventListener("keydown", (e) => {
    if (!$("overlay").hidden) { if (e.key === "Escape") closeDialog(); return; }
    if ($("quiz").hidden) return;
    if (["1", "2", "3", "4"].includes(e.key)) pick(Number(e.key) - 1);
    if (e.key === "ArrowRight" && current < questions.length - 1) { current++; renderQuestion(); }
    if (e.key === "ArrowLeft" && current > 0) { current--; renderQuestion(); }
  });
</script>
</body>
</html>
